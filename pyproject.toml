[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taquin"
version = "1.0.0"
description = "O quebra-cabeca deslizante varrido inteiro por largura: distancia de toda posicao alcancavel, com a paridade da permutacao como juiz."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "condeDeveloper" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
taquin = "taquin.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["taquin*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-q"
